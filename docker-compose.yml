# Local development. Two ways to run (see README.md):
#   docker compose -f infra/docker-compose.yml up -d --wait                  -> Postgres + Redis only; run api/web natively
#   docker compose -f infra/docker-compose.yml --profile app up -d --build --wait -> full stack behind Caddy
# Build contexts assume backend/, frontend/ and infra/ are cloned side by side.
# Host ports 5433/6380 avoid clashing with a native Postgres/Redis; override any host port via infra/.env.
# Fixed project name keeps container and volume names stable regardless of folder.
name: fredd

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fredd
      POSTGRES_PASSWORD: fredd
      POSTGRES_DB: fredd
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fredd"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # --- full stack (profile "app") ---

  migrate:
    profiles: [app]
    build: ../backend
    image: fredd-api
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fredd:fredd@postgres:5432/fredd
      REDIS_URL: redis://redis:6379/0
      # The browser reaches the app through Caddy; the CSRF check only accepts that origin.
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: ../backend
    image: fredd-api
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-8080}
        SITE_ENV: development
    image: fredd-web
    environment:
      # Server components validate the session against the API inside the Docker network.
      API_INTERNAL_URL: http://api:8000

  caddy:
    profiles: [app]
    image: caddy:2
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:

# Local development. Two ways to run (see README.md):
#   docker compose -f fredd-infra/docker-compose.yml up -d --wait                  -> Postgres + Redis only; run api/web natively
#   docker compose -f fredd-infra/docker-compose.yml --profile app up -d --build --wait -> full stack behind Caddy
# Build contexts assume fredd-backend/, fredd-frontend/ and fredd-infra/ are cloned side by side.
# Host ports 5433/6380 avoid clashing with a native Postgres/Redis; override any host port via fredd-infra/.env.
# Fixed project name keeps container and volume names stable regardless of folder.
name: fluctuz

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: fluctuz
      POSTGRES_PASSWORD: fluctuz
      POSTGRES_DB: fluctuz
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluctuz"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # --- full stack (profile "app") ---

  migrate:
    profiles: [app]
    build: ../fredd-backend
    image: fluctuz-api
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluctuz:fluctuz@postgres:5432/fluctuz
      REDIS_URL: redis://redis:6379/0
      # The browser reaches the app through Caddy; the CSRF check only accepts that origin.
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
      # Optional. Without SMTP_HOST the API logs emails instead of sending them; without
      # GOOGLE_CLIENT_ID the "Masuk dengan Google" button answers "unavailable".
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Fluctuz <no-reply@fluctuz.id>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: ../fredd-backend
    image: fluctuz-api
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: ../fredd-frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${APP_PORT:-8080}
        SITE_ENV: development
    image: fluctuz-web
    environment:
      # Server components validate the session against the API inside the Docker network.
      API_INTERNAL_URL: http://api:8000

  caddy:
    profiles: [app]
    image: caddy:2
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
